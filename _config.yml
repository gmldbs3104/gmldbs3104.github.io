# ---------------------------------------------------------------
# 사이트 기본 정보
# ---------------------------------------------------------------
title: "Heeyun's tech blog"
# tagline: "커널부터 화면까지, 시스템을 들여다보는 기록"
# description: "eBPF로 운영체제 동작을 관찰하고, 접근성 있는 인터페이스를 만듭니다."
author:
  name: "Heeyun Ju"
  first_name: "Heeyun"         # 히어로 타이틀의 포인트 컬러 부분
  email: "heeyun.s.ju@gmail.com"
  # bio: "동국대학교 NOSLab에서 eBPF로 리눅스 커널을 관찰합니다. 화면 뒤에서 무슨 일이 일어나는지 궁금해합니다."

# GitHub Pages 배포 주소
url: "https://gmldbs3104.github.io"
baseurl: ""

# ---------------------------------------------------------------
# 소셜 / 연락처
# ---------------------------------------------------------------
social:
  github: "gmldbs3104"
  linkedin: "heeyun-ju-9922622ab"
  twitter: ""

# ---------------------------------------------------------------
# 네비게이션
# ---------------------------------------------------------------
nav:
  - title: "Category"
    url: "/categories/"
  - title: "Blog"
    url: "/blog/"
  - title: "About"
    url: "/about/"
  - title: "Contact"
    url: "/contact/"

# ---------------------------------------------------------------
# 히어로 섹션
# ---------------------------------------------------------------
hero:
  # intro: >
  primary_button:
    label: "About me"
    url: "/about/"

# ---------------------------------------------------------------
# 토픽 필터 (Explore Topics 섹션)
#  - 글에 실제로 쓰는 태그로 맞춰야 필터가 동작합니다.
# ---------------------------------------------------------------
topics:
  visible_count: 5
  featured:
    - eBPF
    - Linux Kernel
    - Performance
    - Accessibility
    - Frontend

# ---------------------------------------------------------------
# 사이드바
# ---------------------------------------------------------------
sidebar:
  popular_title: "Popular Content"
  popular_count: 5

# ---------------------------------------------------------------
# 빌드 설정
# ---------------------------------------------------------------
permalink: /blog/:year/:month/:day/:title/

# 태그 필터·검색이 클라이언트에서 동작하려면 글 목록이 한 페이지에 모두 있어야 하므로
# 서버 사이드 페이지네이션은 쓰지 않습니다.
home_post_limit: 8

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Heeyun Ju"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules

sass:
  style: compressed
