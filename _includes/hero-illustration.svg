<svg viewBox="0 0 520 380" fill="none" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="hero-illust-title">
  <title id="hero-illust-title">노트북 앞에 앉아 코드를 작성하는 사람 일러스트</title>

  <!-- 배경 블롭 -->
  <circle cx="262" cy="176" r="152" fill="var(--color-primary)" opacity="0.07"/>

  <!-- 장식 도트 -->
  <g fill="var(--color-border)">
    <circle cx="72" cy="96" r="3"/><circle cx="90" cy="96" r="3"/><circle cx="108" cy="96" r="3"/>
    <circle cx="72" cy="114" r="3"/><circle cx="90" cy="114" r="3"/><circle cx="108" cy="114" r="3"/>
    <circle cx="72" cy="132" r="3"/><circle cx="90" cy="132" r="3"/><circle cx="108" cy="132" r="3"/>
  </g>

  <!-- 떠 있는 코드 기호 -->
  <g opacity="0.85" stroke="var(--color-primary)" stroke-width="4"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M414 92 L400 106 L414 120"/>
    <path d="M440 92 L454 106 L440 120"/>
    <path d="M432 88 L422 124"/>
  </g>
  <circle cx="392" cy="150" r="4" fill="var(--color-primary)" opacity="0.5"/>
  <circle cx="466" cy="140" r="6" fill="var(--color-primary)" opacity="0.25"/>

  <!-- 바닥 그림자 -->
  <ellipse cx="260" cy="352" rx="186" ry="12" fill="var(--color-border)" opacity="0.55"/>

  <!-- 의자 -->
  <rect x="150" y="188" width="22" height="130" rx="11" fill="#CBD3D8"/>
  <rect x="160" y="300" width="10" height="46" rx="5" fill="#CBD3D8"/>

  <!-- 화분 -->
  <path d="M74 262 h34 l-5 34 a4 4 0 0 1 -4 3 h-16 a4 4 0 0 1 -4 -3 z" fill="var(--color-primary)" opacity="0.35"/>
  <path d="M91 262 c0 -18 -10 -28 -22 -30 c2 16 10 26 22 30 z" fill="var(--color-primary)" opacity="0.6"/>
  <path d="M91 262 c0 -22 10 -34 24 -36 c-2 20 -11 32 -24 36 z" fill="var(--color-primary)"/>

  <!-- 사람 -->
  <g>
    <!-- 다리 -->
    <path d="M198 292 h58 v54 a8 8 0 0 1 -8 8 h-42 a8 8 0 0 1 -8 -8 z" fill="#1E262E"/>
    <!-- 몸통 -->
    <path d="M195 296 c-2 -56 6 -88 35 -93 c29 5 37 37 35 93 z" fill="var(--color-primary)"/>
    <!-- 목 -->
    <rect x="221" y="172" width="18" height="22" rx="7" fill="#F3C6A3"/>
    <!-- 머리 -->
    <circle cx="230" cy="150" r="31" fill="#F3C6A3"/>
    <!-- 머리카락 -->
    <path d="M199 148 c0 -22 14 -36 32 -36 c19 0 30 13 30 30 c0 6 -1 10 -3 13
             c-2 -14 -9 -21 -20 -22 c-13 -1 -21 5 -25 15 c-2 5 -3 10 -3 16
             c-7 -3 -11 -9 -11 -16 z" fill="#1E262E"/>
    <!-- 눈 · 미소 -->
    <circle cx="243" cy="150" r="2.6" fill="#1E262E"/>
    <circle cx="226" cy="150" r="2.6" fill="#1E262E"/>
    <path d="M231 162 c4 3 8 3 12 0" stroke="#1E262E" stroke-width="2.4" stroke-linecap="round"/>
    <!-- 팔 (뒤) -->
    <path d="M258 216 C 284 226 300 248 314 264" stroke="var(--color-primary)"
          stroke-width="17" stroke-linecap="round" opacity="0.75"/>
    <!-- 팔 (앞) -->
    <path d="M254 228 C 278 244 292 258 308 270" stroke="var(--color-primary-deep)"
          stroke-width="17" stroke-linecap="round"/>
    <!-- 손 -->
    <circle cx="316" cy="272" r="9" fill="#F3C6A3"/>
    <circle cx="322" cy="262" r="8" fill="#F3C6A3" opacity="0.9"/>
  </g>

  <!-- 책상 -->
  <rect x="66" y="290" width="388" height="11" rx="5.5" fill="var(--color-border)"/>
  <rect x="96" y="301" width="10" height="48" rx="5" fill="var(--color-border)"/>
  <rect x="414" y="301" width="10" height="48" rx="5" fill="var(--color-border)"/>

  <!-- 노트북 -->
  <g transform="rotate(-2 372 240)">
    <rect x="316" y="192" width="116" height="86" rx="9"
          fill="#FFFFFF" stroke="#1E262E" stroke-width="5"/>
    <g stroke-linecap="round">
      <path d="M332 214 h44" stroke="var(--color-primary)" stroke-width="6"/>
      <path d="M332 230 h68" stroke="var(--color-border)" stroke-width="6"/>
      <path d="M342 246 h52" stroke="var(--color-border)" stroke-width="6"/>
      <path d="M332 262 h30" stroke="var(--color-primary)" stroke-width="6" opacity="0.6"/>
    </g>
  </g>
  <path d="M306 280 h140 l13 11 a3 3 0 0 1 -2 5 h-162 a3 3 0 0 1 -2 -5 z" fill="#1E262E"/>

  <!-- 머그컵 -->
  <path d="M140 264 h30 v20 a8 8 0 0 1 -8 8 h-14 a8 8 0 0 1 -8 -8 z" fill="var(--color-primary)"/>
  <path d="M170 270 h6 a6 6 0 0 1 0 12 h-6" stroke="var(--color-primary)"
        stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M148 254 c0 -6 6 -6 6 -12 M160 254 c0 -6 6 -6 6 -12"
        stroke="var(--color-border)" stroke-width="3" stroke-linecap="round"/>
</svg>
