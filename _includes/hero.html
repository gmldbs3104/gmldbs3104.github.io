<section class="hero">
  <div class="container">

    <h1 class="hero-title">
      <span class="accent">{{ site.author.first_name | default: site.author.name }}</span>'s Tech Blog
    </h1>

    {%- if site.hero.intro %}
    <p class="hero-intro lang-ko">{{ site.hero.intro }}</p>
    {%- endif %}

    <div class="hero-actions">
      <a class="btn btn--primary" href="{{ site.hero.primary_button.url | relative_url }}">
        {{ site.hero.primary_button.label }}
      </a>
    </div>
  </div>
</section>
